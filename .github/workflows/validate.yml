name: Validate courses

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_courses.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: python scripts/package_extensions.py
      - uses: actions/upload-artifact@v4
        with:
          name: podcast-youci-v3-extensions
          path: dist/*.zip
