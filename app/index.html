<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Podlingora · Expanded Listening Preparation</title>
    <style>
      :root { color-scheme: light; --green:#54896e; --green-deep:#397558; --light:#e2efe7; --panel:#f0f5f1; --border:#e0e8e1; --text:#253b31; --muted:#788a7f; --white:#fff; --danger:#a64b42; --ease-out:cubic-bezier(.23,1,.32,1); }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { margin:0; background:#f9fbf9; color:var(--text); font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      button,input,textarea,select { font:inherit; }
      button { cursor:pointer; transition:background-color 140ms ease,border-color 140ms ease,color 140ms ease,transform 140ms var(--ease-out); }
      button:active:not(:disabled) { transform:scale(.97); }
      button:disabled { cursor:not-allowed; opacity:.52; }
      button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
      .hidden,[hidden] { display:none!important; }
      .shell { max-width:780px; margin:0 auto; padding:19px 15px 35px; }
      .brand-row,.title-row,.section-header,.entry-row { display:flex; align-items:center; justify-content:space-between; gap:9px; }
      .brand-row { margin-bottom:14px; }
      .brand-row h1 { margin:0; font-size:20px; line-height:1.2; font-weight:750; }
      .brand-row p { margin:3px 0 0; color:var(--muted); font-size:12px; }
      .pill { display:inline-block; padding:4px 7px; border-radius:6px; background:var(--light); color:var(--green-deep); white-space:nowrap; font-size:11px; }
      .unit-nav { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(78px,1fr); gap:5px; margin-bottom:12px; padding-bottom:4px; overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:thin; }
      .unit-nav button,.tab-nav button { min-width:0; padding:10px 3px; border:0; border-radius:8px; background:var(--panel); color:var(--text); font-size:12px; }
      .unit-nav button.active,.tab-nav button.active,.filters button.active { background:var(--green); color:var(--white); }
      .unit-nav button.complete::after { content:" ✓"; }
      .card { margin-bottom:12px; padding:13px; border:1px solid var(--border); border-radius:14px; background:var(--white); }
      .title-row h2 { margin:1px 0 0; font-size:16px; }
      .meta { color:var(--muted); font-size:11px; }
      .recap { margin:13px 0; padding:11px; border-radius:10px; background:var(--panel); }
      .recap p { margin:4px 0 9px; font-size:12px; line-height:1.7; }
      .recap p:last-child { margin-bottom:0; }
      .section-label { color:var(--green); font-size:11px; font-weight:750; letter-spacing:.03em; }
      .muted { color:var(--muted); }
      .player-toolbar { display:flex; align-items:center; gap:6px; margin:10px 0 13px; flex-wrap:wrap; }
      .player-toolbar .status { flex:1 1 190px; min-width:0; color:var(--muted); font-size:11px; }
      .tab-nav { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; margin-bottom:13px; }
      .section-header h3 { margin:0; font-size:16px; }
      .help { margin:5px 0 10px; font-size:12px; }
      #search { width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:9px; background:var(--white); }
      .filters { display:flex; gap:5px; margin:8px 0 4px; flex-wrap:wrap; }
      .filters button { padding:5px 9px; border:1px solid var(--border); border-radius:7px; background:var(--white); color:var(--text); font-size:11px; }
      .list-scroll { height:440px; max-height:55vh; margin-top:7px; overflow-y:auto; overscroll-behavior:contain; overflow-anchor:none; scrollbar-gutter:stable; }
      .entry { padding:11px 0; border-bottom:1px solid var(--border); }
      .entry:last-child { border-bottom:0; }
      .entry-main { min-width:0; flex:1; }
      .entry-title { font-size:15px; font-weight:650; overflow-wrap:anywhere; }
      .entry-desc { color:var(--muted); font-size:12px; }
      .entry-actions { display:flex; align-items:center; gap:4px; flex:0 0 auto; }
      .icon { width:19px; height:19px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
      .icon-btn,.small-btn { display:inline-grid; width:36px; height:36px; min-width:36px; padding:0; place-items:center; border:1px solid var(--border); border-radius:9px; background:var(--white); color:var(--green); }
      .speech-btn { border-color:var(--green); border-radius:50%; background:var(--green); color:var(--white); }
      .speech-btn.is-speaking { background:var(--green-deep); }
      .small-btn.active,.icon-btn[aria-pressed="true"] { background:var(--light); color:var(--green-deep); }
      .icon-btn.star[aria-pressed="true"] .icon { fill:currentColor; }
      .learn { padding:5px 0; border:0; background:none; color:var(--green); font-size:11px; }
      .level { color:var(--muted); font-size:11px; }
      .memory-coach { margin-top:8px; padding:10px 11px; border-left:3px solid #81ad8d; border-radius:5px 9px 9px 5px; background:var(--panel); }
      .memory-coach .section-label { margin-top:8px; }
      .memory-coach .section-label:first-child { margin-top:0; }
      .memory-coach p { margin:3px 0; font-size:12px; }
      .collocation { margin-top:3px; font-size:12px; }
      .rule { margin:9px 0; border-top:1px solid var(--border); }
      .example-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:5px; }
      .example-row p { margin:0; flex:1; font-size:12px; }
      .origin { color:var(--muted); font-size:10px; }
      .entry > .origin { margin-top:5px; overflow-wrap:anywhere; }
      .chunk-scroll { height:215px; overflow-y:auto; overscroll-behavior:contain; overflow-anchor:none; scrollbar-gutter:stable; }
      .chunk-option { width:100%; padding:11px 0; border:0; border-bottom:1px solid var(--border); background:transparent; text-align:left; }
      .chunk-option.selected .entry-title { color:var(--green); }
      .detail { margin-top:11px; padding:11px; border-radius:10px; background:var(--panel); }
      .detail input { width:100%; min-height:42px; margin:8px 0; padding:9px; border:1px solid var(--border); border-radius:9px; background:var(--white); }
      .scenario-row { display:grid; grid-template-columns:minmax(0,3fr) minmax(110px,2fr); gap:6px; margin-top:8px; }
      .scenario-row>* { width:100%; min-width:0; }
      select,.outline { padding:8px 10px; border:1px solid var(--border); border-radius:9px; background:var(--white); color:var(--text); }
      .buttons { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
      .primary { padding:9px 12px; border:0; border-radius:9px; background:var(--green); color:var(--white); font-size:12px; font-weight:650; }
      .ai-feedback { margin-top:9px; padding:9px; border-radius:8px; background:var(--white); font-size:12px; }
      .ai-feedback.error { color:var(--danger); }
      .collection-scroll { height:170px; overflow-y:auto; overscroll-behavior:contain; overflow-anchor:none; scrollbar-gutter:stable; }
      .collection-item { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); }
      .collection-item:last-child { border:0; }
      .settings summary { cursor:pointer; color:var(--green-deep); font-weight:700; }
      .settings-grid { display:grid; gap:9px; margin-top:10px; }
      .settings-grid label { display:grid; gap:4px; }
      .progress-track { height:7px; overflow:hidden; border-radius:99px; background:var(--panel); }
      .progress-fill { display:block; width:100%; height:100%; background:var(--green); transform:scaleX(0); transform-origin:left; }
      .course-state { min-height:34px; color:var(--muted); font-size:12px; }
      .course-state[data-state="error"] { color:var(--danger); }
      .footnote { margin-top:15px; color:var(--muted); text-align:center; font-size:11px; }
      #toast { position:fixed; bottom:18px; left:50%; z-index:10; display:none; max-width:90%; padding:9px 14px; border-radius:9px; background:#2f6048; color:white; box-shadow:0 4px 16px #0002; transform:translateX(-50%); }
      @media (hover:hover) and (pointer:fine) { button:hover:not(:disabled) { border-color:var(--green); background-color:var(--light); } .speech-btn:hover:not(:disabled),.primary:hover:not(:disabled),.unit-nav button.active:hover,.tab-nav button.active:hover { background-color:var(--green-deep); color:white; } }
      @media (pointer:coarse) { button,select { min-height:44px; } .icon-btn,.small-btn { width:44px; min-width:44px; height:44px; } }
      @media (max-width:480px) { .shell { padding:13px 8px 30px; } .card { padding:11px; } .brand-row h1 { font-size:18px; } .list-scroll { height:430px; max-height:52vh; } .collection-scroll { height:160px; } .entry-row { align-items:flex-start; } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; } }
    </style>
  </head>
  <body>
    <main id="app" class="shell" hidden>
      <header class="brand-row"><div><h1>🎧 <span id="podcastTitle">Podlingora</span></h1><p>Expanded Listening Preparation</p></div><span class="pill">Coverage-first v2.2</span></header>
      <div id="courseNotice" class="course-state" data-state="loading" role="status" aria-live="polite"><span id="courseNoticeText">Loading course…</span> <button id="retryCourse" class="outline hidden" type="button">Retry</button></div>
      <nav id="unitNav" class="unit-nav" aria-label="Units"></nav>
      <section class="card">
        <div class="title-row"><div><div id="unitRange" class="meta"></div><h2 id="unitTitle"></h2></div><span id="counts" class="pill"></span></div>
        <section class="recap"><div class="section-label">STORY RECAP · 故事概要</div><p id="storyZh" hidden></p><div class="section-label">ENGLISH RECAP</div><p id="storyEn"></p><div class="section-label">KEY LISTENING CLUES</div><p id="clues" class="muted"></p></section>
        <div class="player-toolbar" aria-label="Podcast player controls"><button id="listenButton" class="primary" type="button">Play unit</button><button id="pauseButton" class="outline" type="button">Play / Pause</button><button id="replayButton" class="outline" type="button">Replay unit</button><select id="rate" aria-label="Podcast playback speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select><span id="audioStatus" class="status" role="status" aria-live="polite">Original audio uses the ListenLeap player.</span></div>
        <nav id="sectionTabs" class="tab-nav" aria-label="Learning sections"><button data-tab="words" class="active">01 · Words</button><button data-tab="phrases">02 · Phrases</button><button data-tab="chunks">03 · Chunks</button></nav>
        <div class="section-header"><h3 id="sectionHeading"></h3><span id="itemCount" class="pill"></span></div><p id="sectionHelp" class="muted help"></p>
        <div id="searchRow"><input id="search" type="search" placeholder="Search English / 中文…" aria-label="Search entries" /></div><div id="difficulty" class="filters" aria-label="Vocabulary difficulty"></div><div id="list" class="list-scroll"></div><div id="chunkArea" hidden></div>
      </section>
      <section class="card collection-card"><div class="section-header"><h3>My Learning Collection</h3><span id="collectionCount" class="pill">0 saved</span></div><p class="muted help">跨 Unit 收藏 · 保留来源与学习状态</p><div id="collectionList" class="collection-scroll"></div></section>
      <details class="card settings"><summary>Voice Studio & learning settings</summary><div class="settings-grid"><label>English voice <select id="voiceSelect"></select></label><button id="refreshVoices" class="outline" type="button">Refresh voices</button><button id="testVoice" class="outline" type="button">Test voice</button><label>Speech speed <output id="ttsRateLabel">0.95×</output><input id="ttsRate" type="range" min="0.70" max="1.15" step="0.05" value="0.95" /></label><div id="voiceStatus" class="muted" role="status" aria-live="polite"></div><div class="buttons"><button id="aiLogin" class="primary" type="button">Sign in to AI Feedback</button><button id="aiLogout" class="outline" type="button">Sign out</button><span id="aiAuthStatus" class="muted" aria-live="polite"></span></div><label><input id="ready" type="checkbox" /> I listened to this unit</label><label>Notes<textarea id="notes" rows="3"></textarea></label><button id="saveUnit" class="primary" type="button">Save & complete unit</button><div id="progressSummary" class="muted"></div><div class="progress-track" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressFill" class="progress-fill"></span></div><button id="export" class="outline" type="button">Export learning progress</button></div></details>
      <p class="footnote"><a id="sourceLink" target="_blank" rel="noopener">Source episode</a> · Revision <span id="courseRevision"></span></p>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
